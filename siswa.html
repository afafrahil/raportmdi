<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nilai Saya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div>
      <h2>Nilai Akademik</h2>
      <div id="infoTahunSemester" style="font-size:12px; opacity:0.85; margin-top:2px;"></div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="user-info" id="userInfo"></span>
      <button onclick="logout()">Keluar</button>
    </div>
  </div>

  <div class="container">
    <div class="panel">
      <h3 id="judulPeriode">Rincian Nilai</h3>
      <div id="loading" class="loading">Memuat nilai...</div>

      <div id="tabWrap" class="tab-wrap" style="display:none;">
        <div class="tab-nav">
          <button type="button" class="tab-btn active" data-tab="akademik">AKADEMIK</button>
          <button type="button" class="tab-btn" data-tab="sikap">SIKAP</button>
          <button type="button" class="tab-btn" data-tab="kehadiran">KEHADIRAN</button>
        </div>

        <div class="table-scroll tab-panel active" id="tab-akademik">
          <table>
            <thead><tr><th>Mata Pelajaran</th><th>Pengetahuan</th><th>Keterampilan</th></tr></thead>
            <tbody id="tbodyAkademik"></tbody>
          </table>
        </div>

        <div class="table-scroll tab-panel" id="tab-sikap">
          <table>
            <thead><tr><th>Mata Pelajaran</th><th>Spiritual</th><th>Sosial</th></tr></thead>
            <tbody id="tbodySikap"></tbody>
          </table>
        </div>

        <div class="table-scroll tab-panel" id="tab-kehadiran">
          <table>
            <thead><tr><th>Mata Pelajaran</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alfa</th></tr></thead>
            <tbody id="tbodyKehadiran"></tbody>
          </table>
        </div>
      </div>

      <div id="emptyMsg" class="loading" style="display:none;">Belum ada nilai yang diinput untuk periode ini.</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    async function init() {
      const user = requireLogin('Siswa');
      if (!user) return;
      document.getElementById('userInfo').textContent = user.nama + ' (' + user.username + ')';

      apiCall('getInfoLembaga').then(res => {
        if (res.success) {
          document.getElementById('infoTahunSemester').textContent =
            res.tahunAjaran + ' ' + res.semester;
        }
      });

      const res = await apiCall('getNilaiSiswa', { nis: user.username });
      document.getElementById('loading').style.display = 'none';

      if (!res.success) {
        alert(res.message);
        return;
      }

      document.getElementById('judulPeriode').textContent = 'Rincian Nilai - Periode ' + res.periode;

      if (!res.data.length) {
        document.getElementById('emptyMsg').style.display = 'block';
        return;
      }

      const tbodyAkademik = document.getElementById('tbodyAkademik');
      const tbodySikap = document.getElementById('tbodySikap');
      const tbodyKehadiran = document.getElementById('tbodyKehadiran');
      tbodyAkademik.innerHTML = '';
      tbodySikap.innerHTML = '';
      tbodyKehadiran.innerHTML = '';

      res.data.forEach(n => {
        const trA = document.createElement('tr');
        trA.innerHTML = `<td>${n.mapel}</td><td>${n.pengetahuan}</td><td>${n.keterampilan}</td>`;
        tbodyAkademik.appendChild(trA);

        const trS = document.createElement('tr');
        trS.innerHTML = `<td>${n.mapel}</td><td>${n.spiritual}</td><td>${n.sosial}</td>`;
        tbodySikap.appendChild(trS);

        const trK = document.createElement('tr');
        trK.innerHTML = `<td>${n.mapel}</td><td>${n.hadir}</td><td>${n.sakit}</td><td>${n.izin}</td><td>${n.alfa}</td>`;
        tbodyKehadiran.appendChild(trK);
      });

      document.getElementById('tabWrap').style.display = 'block';
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    init();
  </script>
</body>
</html>
