<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beranda - Raport MDI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="brand">Raport MDI<span>.</span></div>
    <div class="user-box">
      <span class="name">Halo, <span id="namaUser">-</span></span>
      <button id="btnLogout">Keluar</button>
    </div>
  </header>

  <main>
    <div class="eyebrow">Beranda</div>
    <h1>Selamat datang, <span id="namaUser2">-</span>.</h1>
    <p class="lead">Berikut ringkasan data dan nilai Anda.</p>

    <div class="cards">
      <div class="card">
        <div class="label">Username</div>
        <div class="value" id="usernameVal">-</div>
      </div>
      <div class="card">
        <div class="label">Kelas</div>
        <div class="value" id="kelasVal">-</div>
      </div>
      <div class="card">
        <div class="label">Role</div>
        <div class="value" id="roleVal">-</div>
      </div>
    </div>

    <div id="tabelWrap">
      <div class="center-loading" id="loadingNilai">Memuat data nilai...</div>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    const username = localStorage.getItem('raport_username');

    if (!username) {
      window.location.href = 'index.html';
    }

    document.getElementById('namaUser').textContent = localStorage.getItem('raport_nama') || username;
    document.getElementById('namaUser2').textContent = localStorage.getItem('raport_nama') || username;
    document.getElementById('usernameVal').textContent = username;
    document.getElementById('kelasVal').textContent = localStorage.getItem('raport_kelas') || '-';
    document.getElementById('roleVal').textContent = localStorage.getItem('raport_role') || '-';

    document.getElementById('btnLogout').addEventListener('click', function(){
      localStorage.clear();
      window.location.href = 'index.html';
    });

    async function muatNilai(){
      const wrap = document.getElementById('tabelWrap');
      try {
        const url = API_URL
          + '?func=Cari'
          + '&SH=' + encodeURIComponent(SHEET_NILAI)
          + '&COLA=' + encodeURIComponent(username);

        const res = await fetch(url);
        const text = (await res.text()).trim();

        if (text === 'Not Found' || !text) {
          wrap.innerHTML = '<div class="center-empty">Data nilai untuk username ini belum ditemukan di sheet "' + SHEET_NILAI + '".</div>';
          return;
        }

        const kolom = text.split('|');
        let rows = '';
        for (let i = 0; i < kolom.length; i++) {
          const label = KOLOM_NILAI[i] || ('Kolom ' + (i + 1));
          rows += '<tr><td>' + label + '</td><td>' + (kolom[i] ?? '') + '</td></tr>';
        }

        wrap.innerHTML =
          '<table class="nilai"><thead><tr><th>Keterangan</th><th>Nilai</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table>';
      } catch (err) {
        wrap.innerHTML = '<div class="center-empty">Tidak bisa memuat data nilai. Periksa API_URL / koneksi.</div>';
      }
    }

    if (username) muatNilai();
  </script>
</body>
</html>
