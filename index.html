<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Aplikasi Penilaian</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    min-height: 100vh;
  }

  .center-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }

  .card h1 {
    font-size: 20px;
    margin-bottom: 4px;
    color: #1a3c34;
  }

  .card p.subtitle {
    color: #666;
    font-size: 13px;
    margin-bottom: 24px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #444;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  button {
    width: 100%;
    padding: 11px;
    background: #1a7a5e;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover { background: #145f49; }

  .error-msg {
    color: #c0392b;
    font-size: 13px;
    margin-bottom: 12px;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="center-wrap">
    <div class="card">
      <div id="lembagaInfo" style="text-align:center; margin-bottom:20px;">
        <img id="logoLembaga" src="" alt="Logo" style="width:70px; height:70px; object-fit:contain; display:none; margin:0 auto 10px;">
        <h1 id="namaLembaga">Aplikasi Penilaian</h1>
        <p class="subtitle" id="infoTahunSemester">Memuat data lembaga...</p>
      </div>

      <div id="errorMsg" class="error-msg"></div>

      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit" id="btnLogin">Masuk</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    async function loadInfoLembaga() {
      try {
        const res = await apiCall('getInfoLembaga');
        if (res.success) {
          document.getElementById('namaLembaga').textContent = res.namaLembaga;
          document.getElementById('infoTahunSemester').textContent =
            res.tahunAjaran + ' ' + res.semester;
          if (res.logoUrl) {
            const img = document.getElementById('logoLembaga');
            img.src = res.logoUrl;
            img.style.display = 'block';
            setFavicon(res.logoUrl);
          }
        }
      } catch (err) {
        console.error('Gagal memuat info lembaga', err);
      }
    }
    loadInfoLembaga();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('btnLogin');

      errorMsg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      try {
        const res = await apiCall('login', { username, password });
        if (res.success) {
          sessionStorage.setItem('nama', res.nama);
          sessionStorage.setItem('username', res.username);
          sessionStorage.setItem('role', res.role);

          if (res.role === 'Guru') {
            window.location.href = 'guru.html';
          } else if (res.role === 'Siswa') {
            window.location.href = 'siswa.html';
          } else {
            errorMsg.textContent = 'Role tidak dikenali: ' + res.role;
          }
        } else {
          errorMsg.textContent = res.message || 'Login gagal';
        }
      } catch (err) {
        errorMsg.textContent = 'Gagal terhubung ke server. Cek koneksi / API_URL.';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
