<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Raport MDI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="frame">
      <div class="side">
        <div class="side-top">
          <div class="eyebrow">Raport MDI</div>
          <div class="side-title">Masuk untuk melihat nilai Anda.</div>
        </div>
        <div class="side-bottom">
          <p>Data login & nilai diambil langsung dari Google Spreadsheet melalui Google Apps Script.</p>
        </div>
      </div>

      <div class="form-panel">
        <h1>Selamat datang kembali</h1>
        <div class="sub">Masukkan username dan password Anda.</div>

        <form id="loginForm">
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
          </div>
          <button type="submit" id="btnLogin">Masuk</button>
          <div class="msg" id="msg"></div>
        </form>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Kalau sudah ada data login tersimpan, langsung ke beranda
    if (localStorage.getItem('raport_username')) {
      window.location.href = 'beranda.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const msg = document.getElementById('msg');

      msg.className = 'msg';
      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Memeriksa...';

      try {
        const url = API_URL
          + '?func=LOGIN'
          + '&SH=' + encodeURIComponent(SHEET_LOGIN)
          + '&USERNAME=' + encodeURIComponent(username)
          + '&PASSWORD=' + encodeURIComponent(password);

        const res = await fetch(url);
        const text = await res.text();
        const parts = text.trim().split('|');

        if (parts[0] === 'SUKSES') {
          // format: SUKSES|username|password|nama|kelas|role
          localStorage.setItem('raport_username', parts[1] || username);
          localStorage.setItem('raport_nama', parts[3] || username);
          localStorage.setItem('raport_kelas', parts[4] || '-');
          localStorage.setItem('raport_role', parts[5] || '-');

          msg.className = 'msg ok';
          msg.textContent = 'Berhasil masuk, mengalihkan...';
          window.location.href = 'beranda.html';
        } else {
          msg.className = 'msg error';
          msg.textContent = 'Username atau password salah.';
        }
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = 'Tidak bisa menghubungi server. Periksa API_URL di config.js.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
