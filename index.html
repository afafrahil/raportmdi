<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Aplikasi Penilaian</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-wrap">
    <div class="card">
      <h1>Aplikasi Penilaian</h1>
      <p class="subtitle">Ma'had Darul Ihsan</p>

      <div id="errorMsg" class="error-msg"></div>

      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit" id="btnLogin">Masuk</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('btnLogin');

      errorMsg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      try {
        const res = await apiCall('login', { username, password });
        if (res.success) {
          sessionStorage.setItem('nama', res.nama);
          sessionStorage.setItem('username', res.username);
          sessionStorage.setItem('role', res.role);

          if (res.role === 'Guru') {
            window.location.href = 'guru.html';
          } else if (res.role === 'Siswa') {
            window.location.href = 'siswa.html';
          } else {
            errorMsg.textContent = 'Role tidak dikenali: ' + res.role;
          }
        } else {
          errorMsg.textContent = res.message || 'Login gagal';
        }
      } catch (err) {
        errorMsg.textContent = 'Gagal terhubung ke server. Cek koneksi / API_URL.';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
