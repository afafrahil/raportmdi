<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Guru - Input Nilai</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div>
      <h2>Input Nilai Siswa</h2>
      <div id="infoTahunSemester" style="font-size:12px; opacity:0.85; margin-top:2px;"></div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="user-info" id="userInfo"></span>
      <button onclick="logout()">Keluar</button>
    </div>
  </div>

  <div class="container">
    <div class="panel">
      <h3>Pilih Kelas & Mata Pelajaran</h3>
      <label for="selAssign">Kelas - Mata Pelajaran yang Anda ampu</label>
      <select id="selAssign"></select>
      <div id="loadingAssign" class="loading" style="display:none;">Memuat data...</div>
    </div>

    <div class="panel" id="panelNilai" style="display:none;">
      <h3 id="judulTabel">Daftar Siswa</h3>
      <div id="loadingSiswa" class="loading">Memuat siswa...</div>

      <div id="tabWrap" class="tab-wrap" style="display:none;">
        <div class="tab-nav">
          <button type="button" class="tab-btn active" data-tab="akademik">AKADEMIK</button>
          <button type="button" class="tab-btn" data-tab="sikap">SIKAP</button>
          <button type="button" class="tab-btn" data-tab="kehadiran">KEHADIRAN</button>
        </div>

        <div class="table-scroll tab-panel active" id="tab-akademik">
          <table>
            <thead>
              <tr><th>NIS</th><th>Nama Siswa</th><th>Pengetahuan</th><th>Keterampilan</th></tr>
            </thead>
            <tbody id="tbodyAkademik"></tbody>
          </table>
        </div>

        <div class="table-scroll tab-panel" id="tab-sikap">
          <table>
            <thead>
              <tr><th>NIS</th><th>Nama Siswa</th><th>Spiritual</th><th>Sosial</th></tr>
            </thead>
            <tbody id="tbodySikap"></tbody>
          </table>
        </div>

        <div class="table-scroll tab-panel" id="tab-kehadiran">
          <table>
            <thead>
              <tr><th>NIS</th><th>Nama Siswa</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alfa</th></tr>
            </thead>
            <tbody id="tbodyKehadiran"></tbody>
          </table>
        </div>
      </div>

      <div class="save-bar">
        <div id="saveMsg" class="success-msg" style="align-self:center;"></div>
        <button id="btnSimpan" onclick="simpanNilai()">Simpan Nilai</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let assignments = [];
    let siswaList = [];
    let user;

    async function init() {
      user = requireLogin('Guru');
      if (!user) return;
      document.getElementById('userInfo').textContent = user.nama;

      apiCall('getInfoLembaga').then(res => {
        if (res.success) {
          document.getElementById('infoTahunSemester').textContent =
            res.tahunAjaran + ' ' + res.semester;
        }
      });

      document.getElementById('loadingAssign').style.display = 'block';
      const res = await apiCall('getGuruAssignments', { namaGuru: user.nama });
      document.getElementById('loadingAssign').style.display = 'none';

      if (!res.success) {
        alert(res.message);
        return;
      }
      assignments = res.data;
      const sel = document.getElementById('selAssign');
      sel.innerHTML = '<option value="">-- Pilih --</option>';
      assignments.forEach((a, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = a.kelas + ' - ' + a.mapel;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', onAssignChange);
    }

    async function onAssignChange() {
      const idx = document.getElementById('selAssign').value;
      const panel = document.getElementById('panelNilai');
      const tabWrap = document.getElementById('tabWrap');
      const loading = document.getElementById('loadingSiswa');
      document.getElementById('saveMsg').textContent = '';

      if (idx === '') { panel.style.display = 'none'; return; }

      const a = assignments[idx];
      panel.style.display = 'block';
      tabWrap.style.display = 'none';
      loading.style.display = 'block';
      document.getElementById('judulTabel').textContent = 'Nilai ' + a.kelas + ' - ' + a.mapel;

      const [siswaRes, nilaiRes] = await Promise.all([
        apiCall('getSiswaByKelas', { kelas: a.kelas }),
        apiCall('getNilaiForInput', { kelas: a.kelas, mapel: a.mapel })
      ]);

      loading.style.display = 'none';

      if (!siswaRes.success) { alert(siswaRes.message); return; }
      siswaList = siswaRes.data;
      const existingNilai = nilaiRes.success ? nilaiRes.data : {};

      const tbodyAkademik = document.getElementById('tbodyAkademik');
      const tbodySikap = document.getElementById('tbodySikap');
      const tbodyKehadiran = document.getElementById('tbodyKehadiran');
      tbodyAkademik.innerHTML = '';
      tbodySikap.innerHTML = '';
      tbodyKehadiran.innerHTML = '';

      siswaList.forEach(s => {
        const n = existingNilai[s.nis] || {};
        const inp = (field, val, max) => `<input type="number" min="0" ${max ? 'max="' + max + '"' : ''} data-nis="${s.nis}" data-field="${field}" value="${val ?? ''}">`;

        const trA = document.createElement('tr');
        trA.innerHTML = `
          <td>${s.nis}</td><td>${s.nama}</td>
          <td>${inp('pengetahuan', n.pengetahuan, 100)}</td>
          <td>${inp('keterampilan', n.keterampilan, 100)}</td>
        `;
        tbodyAkademik.appendChild(trA);

        const trS = document.createElement('tr');
        trS.innerHTML = `
          <td>${s.nis}</td><td>${s.nama}</td>
          <td>${inp('spiritual', n.spiritual, 100)}</td>
          <td>${inp('sosial', n.sosial, 100)}</td>
        `;
        tbodySikap.appendChild(trS);

        const trK = document.createElement('tr');
        trK.innerHTML = `
          <td>${s.nis}</td><td>${s.nama}</td>
          <td>${inp('hadir', n.hadir)}</td>
          <td>${inp('sakit', n.sakit)}</td>
          <td>${inp('izin', n.izin)}</td>
          <td>${inp('alfa', n.alfa)}</td>
        `;
        tbodyKehadiran.appendChild(trK);
      });

      tabWrap.style.display = 'block';
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    async function simpanNilai() {
      const idx = document.getElementById('selAssign').value;
      if (idx === '') return;
      const a = assignments[idx];
      const btn = document.getElementById('btnSimpan');
      const saveMsg = document.getElementById('saveMsg');

      const data = siswaList.map(s => {
        const get = (field) => {
          const el = document.querySelector(`input[data-nis="${s.nis}"][data-field="${field}"]`);
          return el.value === '' ? '' : Number(el.value);
        };
        return {
          nis: s.nis,
          nama: s.nama,
          pengetahuan: get('pengetahuan'),
          keterampilan: get('keterampilan'),
          spiritual: get('spiritual'),
          sosial: get('sosial'),
          hadir: get('hadir'),
          sakit: get('sakit'),
          izin: get('izin'),
          alfa: get('alfa')
        };
      });

      btn.disabled = true;
      btn.textContent = 'Menyimpan...';
      saveMsg.textContent = '';

      try {
        const res = await apiCall('saveNilai', { kelas: a.kelas, mapel: a.mapel, data });
        saveMsg.textContent = res.success ? 'Nilai tersimpan ✓' : ('Gagal: ' + res.message);
        saveMsg.style.color = res.success ? '#1a7a5e' : '#c0392b';
      } catch (err) {
        saveMsg.textContent = 'Gagal terhubung ke server';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Simpan Nilai';
      }
    }

    init();
  </script>
</body>
</html>
